[package]
name = "codex-chat-pane"
version = "0.1.0"
description = "Codex project and chat side panel"
authors = ["CodexChatPane contributors"]
edition = "2021"

[lib]
name = "codex_chat_pane_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-single-instance = "2.4"
toml = "0.9"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
