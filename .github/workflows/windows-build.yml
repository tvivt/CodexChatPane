name: Windows portable build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check and build portable executable
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-app.ps1

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CodexChatPane-windows-portable
          path: release/CodexChatPane-v*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: CodexChatPane-windows-portable
          path: release

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Join-Path $env:GITHUB_WORKSPACE "release\CodexChatPane-$env:GITHUB_REF_NAME.exe"
          if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
          $notes = "doc/releases/$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notes)) { throw "Missing release notes: $notes" }
          gh release create "$env:GITHUB_REF_NAME" $asset --repo "$env:GITHUB_REPOSITORY" --verify-tag --title "$env:GITHUB_REF_NAME" --notes-file $notes
