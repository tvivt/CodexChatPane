name: Windows portable build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Check frontend
        run: |
          node tests/frontend.mjs
          node tests/dynamic.mjs

      - name: Check Rust
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build portable executable
        run: |
          npm run build
          cargo build --manifest-path src-tauri/Cargo.toml --bin CodexChatPane --features custom-protocol --release --locked

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: CodexChatPane-windows-portable
          path: src-tauri/target/release/CodexChatPane.exe
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: CodexChatPane-windows-portable
          path: release

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Join-Path $env:GITHUB_WORKSPACE "release\CodexChatPane.exe"
          if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
          gh release create "$env:GITHUB_REF_NAME" $asset --repo "$env:GITHUB_REPOSITORY" --verify-tag --title "$env:GITHUB_REF_NAME" --generate-notes
