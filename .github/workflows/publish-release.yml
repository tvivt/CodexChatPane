name: Publish GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        default: v0.1.0
        type: string
      build-run-id:
        description: Successful Windows build run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: CodexChatPane-windows-portable
          path: dist
          run-id: ${{ inputs.build-run-id }}
          github-token: ${{ github.token }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CodexChatPane $RELEASE_TAG" \
            --generate-notes \
            dist/CodexChatPane.exe
